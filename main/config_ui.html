        });
        c.dataset.wired='1';
      }
    }

    /* Refresh .pg-on / .pg-num / draggable on the rotation rows from
       _arpOrder without rebuilding the list (keeps focus and scroll). */
    function renumberArp(){
      var c=$('arp-container');
      if(!c) return;
      c.querySelectorAll('.pg-row').forEach(function(row){
        var pos=_arpOrder.indexOf(parseInt(row.getAttribute('data-arp-idx')));
        row.classList.toggle('pg-on',pos>=0);
        if(pos>=0) row.setAttribute('draggable','true'); else row.removeAttribute('draggable');
        row.querySelector('.pg-num').textContent=pos>=0?pos+1:'';
      });
    }

    /* The static rotation table has no `available` flag: derive it from the
       registry once loaded (chip text + .pg-off). Before that every row reads
       "enabled", matching the old all-rows-normal look. */
    function refreshArpAvailability(){
      var c=$('arp-container');
      if(!c||!_pageRegistry.length) return;
      var avail={};
      _pageRegistry.forEach(function(p){ avail[p.id]=p.available!==false; });
      c.querySelectorAll('.pg-row').forEach(function(row){
        var id=parseInt(row.getAttribute('data-arp-idx'));
        var ok=avail[id]!==false;
        row.classList.toggle('pg-off',!ok);
        var chip=row.querySelector('.pg-chip');
        if(chip) chip.textContent=ok?'enabled':'disabled';
      });
    }

    /* === Rotation Drag-to-Reorder ===
       Only ticked rows (draggable="true") can be dragged or dropped on. A
       drop moves the dragged id before/after the target id in _arpOrder
       (by the pointer's Y against the target row's midline) and renumbers;
       DOM rows never move. */
    function initPillDragReorder(container){
      var dragSrc=null;

      function rowId(row){ return parseInt(row.getAttribute('data-arp-idx')); }
      function clearOver(){ container.querySelectorAll('.pg-row.drag-over').forEach(function(p){p.classList.remove('drag-over');}); }
      function dropRow(el){
        var row=el&&el.closest?el.closest('.pg-row'):null;
        return row&&row.classList.contains('pg-on')?row:null;
      }
      function moveInOrder(src,target,clientY){
        var from=_arpOrder.indexOf(rowId(src)), toId=rowId(target);
        if(from<0||_arpOrder.indexOf(toId)<0) return;
        /* remove the dragged id first so `to` is computed on the shortened array */
        _arpOrder.splice(from,1);
        var to=_arpOrder.indexOf(toId);
        var rect=target.getBoundingClientRect();
        if(clientY>=rect.top+rect.height/2) to++;
        _arpOrder.splice(to,0,rowId(src));
        renumberArp();
        checkDirty();
      }

      container.addEventListener('dragstart',function(e){
        var row=dropRow(e.target);
        if(!row){ e.preventDefault(); return; }
        dragSrc=row;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain','');
      });

      container.addEventListener('dragover',function(e){
        if(!dragSrc) return;
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        var row=dropRow(e.target);
        clearOver();
        if(row&&row!==dragSrc) row.classList.add('drag-over');
      });

      container.addEventListener('dragleave',function(e){
        var row=e.target.closest('.pg-row');
        if(row) row.classList.remove('drag-over');
      });

      container.addEventListener('drop',function(e){
        e.preventDefault();
        var target=dropRow(e.target);
        clearOver();
        if(!target||!dragSrc||target===dragSrc) return;
        moveInOrder(dragSrc,target,e.clientY);
      });

      container.addEventListener('dragend',function(e){
        var row=e.target.closest('.pg-row');
        if(row) row.classList.remove('dragging');
        clearOver();
        dragSrc=null;
      });

      /* Touch support for mobile: starts from the grip only, so a finger
         scrolling over the (now full-width) rows is not hijacked. */
      var touchSrc=null, touchStartY=0, touchStartX=0;

      container.addEventListener('touchstart',function(e){
        if(!e.target.closest('.pg-grip')) return;
        var row=dropRow(e.target);
        if(!row) return;
        touchSrc=row;
        var touch=e.touches[0];
        touchStartX=touch.clientX;
        touchStartY=touch.clientY;
      },{passive:true});

      container.addEventListener('touchmove',function(e){
        if(!touchSrc) return;
        var touch=e.touches[0];
        var dx=Math.abs(touch.clientX-touchStartX);
        var dy=Math.abs(touch.clientY-touchStartY);
        if(dx<10&&dy<10) return;
        e.preventDefault();
        touchSrc.classList.add('dragging');
        clearOver();
        var target=dropRow(document.elementFromPoint(touch.clientX,touch.clientY));
        if(target&&target!==touchSrc) target.classList.add('drag-over');
      },{passive:false});

      container.addEventListener('touchend',function(e){
        if(!touchSrc) return;
        touchSrc.classList.remove('dragging');
        clearOver();
        if(e.changedTouches.length>0){
          var touch=e.changedTouches[0];
          var target=dropRow(document.elementFromPoint(touch.clientX,touch.clientY));
          if(target&&target!==touchSrc) moveInOrder(touchSrc,target,touch.clientY);
        }
        touchSrc=null;
      });
    }

    /* === Tab Accent Colors === */
    const tabAccents={
      display: {color:'#7aa2f7', rgb:'122, 162, 247'},
      nodes:   {color:'#7aa2f7', rgb:'122, 162, 247'},
      behavior:{color:'#7aa2f7', rgb:'122, 162, 247'},
      system:  {color:'#7aa2f7', rgb:'122, 162, 247'},
      logs:    {color:'#7aa2f7', rgb:'122, 162, 247'},
      allsky:  {color:'#7aa2f7', rgb:'122, 162, 247'},
      json:    {color:'#7aa2f7', rgb:'122, 162, 247'},
      ha:      {color:'#7aa2f7', rgb:'122, 162, 247'},
      clock:   {color:'#7aa2f7', rgb:'122, 162, 247'},
      spotify: {color:'#7aa2f7', rgb:'122, 162, 247'},
      backup:  {color:'#7aa2f7', rgb:'122, 162, 247'},
      api:     {color:'#7aa2f7', rgb:'122, 162, 247'}
    };

    function setAccent(name){
      var a=tabAccents[name]||tabAccents.display;
      var r=document.documentElement.style;
      r.setProperty('--accent',a.color);
      r.setProperty('--accent-rgb',a.rgb);
    }

    /* === Tab Fragment Loader ===
       Canonical tab list, in the same order the panels appear in the DOM.
       P6a landed the loader machinery with every tab still pre-populated in
       loadedTabs (no-op ensureTabLoaded() for all names). P6b extracted logs,
       backup, and api. P6c extracted allsky, clock, spotify, and the image
       pages. P6d (final wave) extracts the remaining four -- nodes,
       display, behavior, system -- so every tab now ships as
       main/fragment_NAME.html (embedded, served by GET /ui/fragment?tab=NAME)
       and loadedTabs starts empty: every tab, including the default ('nodes',
       or whichever was restored from localStorage), is fetched lazily on
       first activation. switchTab() (see below) activates the panel
       immediately with an inline loading placeholder, then awaits
       ensureTabLoaded() before running the tab's populate/activation hooks,
       so the initial switchTab() call at boot -- which shows whichever tab
       was last active -- transparently fetches that tab's fragment first; no
       separate boot-time special case is needed for the default tab. */
    const TAB_ORDER=['nodes','allsky','json','ha','clock','spotify','image-goes','image-moon','image-solar','image-custom','image-radar','image-clouds','octoprint','adsb','display','behavior','voice-clips','system','logs','backup','api'];
    const LAZY_TABS=new Set(TAB_ORDER);
    const loadedTabs=new Set(TAB_ORDER.filter(n=>!LAZY_TABS.has(n)));

    /* Serializes fragment fetches onto one chain so tabs never load in
       parallel -- each GET /ui/fragment reuses the browser's kept-alive
       connection to this device one request at a time, never a prefetch
       burst. */
    let _fragInFlight=Promise.resolve();

    /* A <script> parsed out of innerHTML is inert. Replacing each one with a
       freshly created node makes the browser run it, and an inline (src-less)
       script runs synchronously during the replaceChild call -- so by the time
       this returns, the fragment's functions are on window and the caller can
       populate the tab immediately. Fragment scripts guard themselves against
       a second execution (a failed load can be retried, which refetches and
       reinjects), so calling this twice on the same tab is harmless. */
    function activateFragmentScripts(root){
      var olds=root.querySelectorAll('script');
      for(var i=0;i<olds.length;i++){
        var old=olds[i];
        var s=document.createElement('script');
        if(old.type) s.type=old.type;
        s.textContent=old.textContent;
        old.parentNode.replaceChild(s,old);
      }
    }

    async function loadTabFragment(name){
      var panel=$('tab-'+name);
      if(!panel) return;
      try{
        var resp=await fetch('/ui/fragment?tab='+encodeURIComponent(name));
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        panel.innerHTML=await resp.text();
        loadedTabs.add(name);
        /* innerHTML never executes <script> nodes, so fragments that ship
           their own behavior (json, ha) need theirs re-created by hand --
           see activateFragmentScripts. Runs before the populate hook below. */
        activateFragmentScripts(panel);
        /* Re-scan only the newly-injected subtree for collapsible cards --
           re-scanning the whole document here would re-attach a second click
           listener to every already-loaded tab's cards. */
        if(typeof initCollapsibleCards==='function') initCollapsibleCards(panel);
        if(_cfgCache && POPULATE_TAB_FNS[name]){
          try{
            /* AWAIT: populateTab_behavior is async (it awaits the page registry
               before setting any value), so calling it and adopting on the next
               line would snapshot the fragment's raw HTML defaults -- zeroed
               masks, active_page_override -1, an all-0xFF auto_rotate_order2 --
               as this tab's baseline, i.e. exactly the permanent stale diff this
               work exists to remove. await also covers the sync populators
               (await on a non-promise is a no-op) and routes an async rejection
               into the same catch as a sync throw. */
            await POPULATE_TAB_FNS[name](_cfgCache);
            /* Populated after the baseline was taken: adopt this tab's values so
               its untouched keys never ride a Save (see baselineAdoptTab). Skipped
               on failure -- a half-populated tab's DOM is not a baseline. */
            baselineAdoptTab(name);
          }
          catch(e){
            console.error('populateTab_'+name+' failed',e);
            _populateFailed=true;
            cfgOverlay('error');
          }
        }
      }catch(e){
        console.error('Failed to load tab fragment: '+name,e);
        /* Leave the tab out of loadedTabs so the next attempt refetches; give
           the user an explicit retry instead of a stuck "Loading..." panel. */
        if(panel && !loadedTabs.has(name)){
          panel.innerHTML='<div class="tab-loading" style="cursor:pointer" '+
            'onclick="switchTab(\''+name+'\')">Couldn\'t load this tab &mdash; tap to retry</div>';
        }
      }
      _queuedTabs.delete(name);
    }

    /* Await before showing/using a tab. Chains onto _fragInFlight so a rapid
       double-tap (or programmatic switchTab calls) can never issue two
       fragment fetches concurrently -- the socket budget only tolerates one
       polite serial GET at a time (see CLAUDE.md connection ceiling). */
    /* Names already sitting in the chain (queued or in flight). Prevents a
       click on a tab the idle prefetch just enqueued (or a rapid double-tap)
       from chaining a duplicate fetch of the same fragment; cleared by
       loadTabFragment() when the attempt finishes so a failed load can be
       retried by the next click. */
    const _queuedTabs=new Set();
    function ensureTabLoaded(name){
      if(loadedTabs.has(name)||_queuedTabs.has(name)) return _fragInFlight;
      _queuedTabs.add(name);
      _fragInFlight=_fragInFlight.then(()=>loadTabFragment(name));
      return _fragInFlight;
    }

    /* === Idle Tab Prefetch ===
       After the boot tab has settled, trickle-fetch the remaining fragments
       one at a time through the same ensureTabLoaded() chain (never in
       parallel; the serialization comment above still holds). Only ever one
       prefetch is enqueued at a time, so a user click on an unloaded tab
       waits behind at most one in-flight fragment. Fragments only -- no API
       data is prefetched. _prefetchIdx advances past failures so a bad
       fragment cannot retry-loop. */
    let _prefetchIdx=0;
    function prefetchNextTab(){
      while(_prefetchIdx<TAB_ORDER.length && loadedTabs.has(TAB_ORDER[_prefetchIdx])) _prefetchIdx++;
      if(_prefetchIdx>=TAB_ORDER.length) return;
      var name=TAB_ORDER[_prefetchIdx++];
      ensureTabLoaded(name).then(function(){ setTimeout(prefetchNextTab,300); });
    }
    function startTabPrefetch(){
      if(typeof requestIdleCallback==='function') requestIdleCallback(prefetchNextTab,{timeout:2000});
      else setTimeout(prefetchNextTab,2000);
    }

    /* === Config Fetch Cache ===
       Memoizes GET /api/config so the many readers of the whole-config blob
       (populateConfig, per-tab lazy-populate on fragment load, getConfigData's
       seed for not-yet-loaded tabs) share one fetch instead of each issuing
       their own. Invalidated by any successful write to /api/config. */
    let _cfgCache=null;
    let _cfgFetchPromise=null;
    var _cfgStale=false;
    function fetchConfig(force){
      if(!force && _cfgCache && !_cfgStale) return Promise.resolve(_cfgCache);
      if(_cfgFetchPromise) return _cfgFetchPromise;
      _cfgFetchPromise=fetch('/api/config').then(r=>r.json()).then(function(data){
        _cfgCache=data;
        _cfgStale=false;
        _cfgFetchPromise=null;
        return data;
      }).catch(function(e){
        _cfgFetchPromise=null;
        throw e;
      });
      return _cfgFetchPromise;
    }
    /* Invalidation marks the cache stale rather than nulling it: a non-null
       _cfgCache is what configLoadedGuard()/liveApply()/checkDirty() use as
       proof the page was populated from real device state, and tabs opened
       after a save still populate from the (slightly stale) copy instead of
       showing empty fields. The next fetchConfig() refetches. */
    function invalidateConfigCache(){ _cfgStale=true; }

    /* === Short-TTL Status/Version Memo ===
       Mirrors _cfgCache for the two small read-only GETs that several tabs
       share (/api/version, /api/status), so e.g. opening Logs then Backup a
       moment apart reuses one response instead of hitting the device twice.
       TTL is 4s -- deliberately under the 5s nav-metrics poll interval so
       every poll tick still fetches fresh data (a TTL equal to the interval
       would make alternate ticks hit the cache and halve the poll rate).
       Errors are never cached; concurrent callers share one in-flight fetch. */
    const _memoTTL=4000;
    var _memoCache={};
    var _memoInFlight={};
    function fetchJsonMemo(url){
      var hit=_memoCache[url];
      if(hit && (Date.now()-hit.t)<_memoTTL) return Promise.resolve(hit.data);
      if(_memoInFlight[url]) return _memoInFlight[url];
      _memoInFlight[url]=fetch(url).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      }).then(function(data){
        _memoCache[url]={t:Date.now(),data:data};
        delete _memoInFlight[url];
        return data;
      }).catch(function(e){
        delete _memoInFlight[url];
        throw e;
      });
      return _memoInFlight[url];
    }

    /* === Tab Navigation ===
       Active classes swap immediately on click so the nav never feels dead
       while a fragment downloads (first visit used to block 200ms-1s with no
       feedback); an unloaded panel shows an inline placeholder until its
       fragment arrives. _currentTab tracks the most recent request: if the
       user clicks elsewhere before a slow fragment resolves, the late
       fragment still lands in its own (now background) panel via
       loadTabFragment(), but the per-tab activation side effects below only
       run for the tab that is still current. */
    /* Two-tier bar: map each tab to its owning section so the section button
       highlights and row 2 shows the matching tab group. _lastUsedTab remembers
       the tab last visited in each section (in-memory) so a section click lands
       on a sensible default; switchTab() keeps it seeded as tabs activate. */
    const TAB_GROUP = { nodes:'pages', allsky:'pages', json:'pages', ha:'pages', clock:'pages', spotify:'pages', 'image-goes':'pages', 'image-moon':'pages', 'image-solar':'pages', 'image-custom':'pages', 'image-radar':'pages', 'image-clouds':'pages', octoprint:'pages', adsb:'pages', display:'device', behavior:'device', 'voice-clips':'device', system:'device', logs:'tools', backup:'tools', api:'tools' };
    var _lastUsedTab={};
    function highlightGroup(name){
      var sec=TAB_GROUP[name];
      $$('.nav-section[data-section]').forEach(b=>b.classList.toggle('active', b.dataset.section===sec));
      $$('.tab-group').forEach(g=>g.classList.toggle('active', g.dataset.section===sec));
      if(sec) _lastUsedTab[sec]=name;
      alignRow2();
    }

    function alignRow2(){
      var grp=document.querySelector('.nav-row2 .tab-group.active');
      if(!grp) return;
      var nav=document.querySelector('.top-nav');
      var row2=document.querySelector('.nav-row2');
      var btn=document.querySelector('.nav-section[data-section="'+grp.dataset.section+'"]');
      if(!nav||!row2||!btn) return;
      var indent=btn.getBoundingClientRect().left-row2.getBoundingClientRect().left-parseFloat(getComputedStyle(row2).paddingLeft);
      nav.style.setProperty('--r2i', Math.max(0,indent)+'px');
    }
    window.addEventListener('resize', alignRow2);
    window.addEventListener('load', alignRow2);

    let _currentTab=null;
    async function switchTab(name){
      _currentTab=name;
      /* Keep the URL in step with the visible tab so a reload (or a copied
         link) lands back here, not on whatever hash the page arrived with.
         replaceState: no history entry per tab, no hashchange feedback loop. */
      try{ if(location.hash!=='#'+name) history.replaceState(null,'','#'+name); }catch(e){}
      $$('.tab-panel').forEach(p=>p.classList.remove('active'));
      $$('.tab-btn').forEach(b=>b.classList.remove('active'));
      var panel=$('tab-'+name);
      if(panel){
        panel.classList.add('active');
        /* Placeholder only when the fragment is genuinely absent; if a load
           is already queued it will overwrite this on arrival. */
        if(!loadedTabs.has(name)) panel.innerHTML='<div class="tab-loading">Loading…</div>';
      }
      $$('[data-tab="'+name+'"]').forEach(b=>b.classList.add('active'));
      setAccent(name);
      // Activate the owning section + tab group (covers restore, deep links)
      highlightGroup(name);
      try{localStorage.setItem('nina_tab',name);}catch(e){}
      await ensureTabLoaded(name);
      /* User moved on while this fragment loaded: skip activation hooks; the
         current tab's own switchTab() call owns them now. */
      if(_currentTab!==name) return;
      if(name==='logs'){
        /* Re-enter the currently selected source; refreshes it and (for device)
           resumes auto-refresh. Falls back to direct calls if not yet defined. */
        if(typeof setLogSource==='function') setLogSource(typeof activeLogSource!=='undefined'?activeLogSource:'device');
        else if(typeof refreshLogs==='function') refreshLogs();
      } else {
        if(typeof stopLogsAutoRefresh==='function') stopLogsAutoRefresh();
      }
      // Pull fresh device metrics the moment the System tab is opened so the
      // status widgets populate instantly instead of waiting for the next poll.
      if(name==='system' && typeof refreshNavMetrics==='function') refreshNavMetrics();
      if(name==='api' && typeof apiInjectHost==='function') apiInjectHost();
      // Voice Clips: refresh storage state + Default/Custom badges on every visit.
      if(name==='voice-clips' && typeof window.vcRefresh==='function') window.vcRefresh();
      /* Home Page / idle target lists are registry-driven; if the boot-time
         /api/pages fetch lost the race, try again whenever Behavior opens. */
      if(name==='behavior' && !_pageRegistry.length){
        fetchPageRegistry().then(function(){ if(_pageRegistry.length) populatePageControls(); });
      }
    }

    $$('.tab-btn').forEach(btn=>{
      btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
    });
    // Section click lands on that section's last-used tab (first tab on cold start).
    $$('.nav-section[data-section]').forEach(b=>b.addEventListener('click',()=>{
      var sec=b.dataset.section;
      var g=document.querySelector('.tab-group[data-section="'+sec+'"]');
      if(!g) return;
      var t=_lastUsedTab[sec];
      var btn=t&&g.querySelector('[data-tab="'+t+'"]');
      if(!btn) btn=g.querySelector('.tab-btn');
      if(btn) switchTab(btn.dataset.tab);
    }));

    try{
      var hashTab=location.hash.replace('#','');
      var saved=localStorage.getItem('nina_tab');
      if(hashTab&&$('tab-'+hashTab)) switchTab(hashTab);
      else if(saved&&$('tab-'+saved)) switchTab(saved);
      else switchTab('nodes');
    }catch(e){ switchTab('nodes'); }
    window.addEventListener('hashchange',()=>{
      var t=location.hash.replace('#','');
      if(t&&$('tab-'+t)) switchTab(t);
    });

    /* === Live API Controls === */
    function setTheme(v){postJson('/api/theme',{theme_index:parseInt(v)})}
    function setWidgetStyle(v){postJson('/api/widget-style',{widget_style:parseInt(v)})}
    function setScreenRotation(v){postJson('/api/screen-rotation',{screen_rotation:parseInt(v)})}

    function updateAggregationLabel(v){
      $('toast_aggregation_val').textContent=parseInt(v)===0?'Off':v+'s';
    }

    let _brightTimer=null;
    function setBrightness(v){
      $('brightness_val').textContent=v+'%';
      clearTimeout(_brightTimer);
      _brightTimer=setTimeout(()=>postJson('/api/brightness',{brightness:parseInt(v)}),150);
    }

    let _colorTimer=null;
    function setColorBrightness(v){
      $('color_brightness_val').textContent=v+'%';
      clearTimeout(_colorTimer);
      _colorTimer=setTimeout(()=>postJson('/api/color-brightness',{color_brightness:parseInt(v)}),150);
    }

    /* === Page Navigation (Start Page + Auto Cycle) === */
    /* Home Page list from the device page registry (single source of truth).
       Radio value = registry id. Unavailable pages stay selectable (marked
       "disabled") so a page that becomes available later can still be picked.
       Radios have no id; data-cfg-key on the container tells markTouched
       which config key this group feeds. */
    function buildStartPagePills(){
      var c=$('start-page-pills');
      if(!c) return;
      renderPageList(c,targetablePages(),{mode:'radio',name:'start_page'});
      if(c.dataset.wired!=='1'){
        /* checkDirty/markTouched run via the .content change delegate. */
        c.addEventListener('change',function(e){ if(e.target.closest('.pg-row')) onStartPageChange(); });
        c.dataset.wired='1';
      }
    }

    function getStartPageValue(){
      var checked=document.querySelector('input[name="start_page"]:checked');
      return checked?parseInt(checked.value):-1;
    }

    /* Mark the checked row of a radio page list (.pg-on shows its star). */
    function pgMarkRadioRow(c){
      if(!c) return;
      c.querySelectorAll('.pg-row').forEach(function(row){ row.classList.toggle('pg-on',row.querySelector('input').checked); });
    }
    /* Check the radio of group `name` whose value is val; first row if none matches. */
    function pgSelectRadio(name,val){
      var radios=document.querySelectorAll('input[name="'+name+'"]'), found=false;
      radios.forEach(function(r){ if(parseInt(r.value)===val){r.checked=true;found=true;} });
      if(!found&&radios.length>0) radios[0].checked=true;
      return found;
    }
    /* {label,cat} of the checked row in a radio page list, or null. */
    function pgChecked(c){
      var checked=c?c.querySelector('input:checked'):null;
      if(!checked) return null;
      var row=checked.closest('.pg-row'), group=row.closest('.pg-group');
      return {label:row.querySelector('.pg-label').textContent, cat:group?group.querySelector('.pg-group-title').textContent:''};
    }

    function setStartPageValue(val){
      pgSelectRadio('start_page',val);
      pgMarkRadioRow($('start-page-pills'));
      updateStartPageSummary();
    }

    /* "<label> · <category>" echoed in the Home Page subsection title. */
    function updateStartPageSummary(){
      var s=$('start_page_summary');
      if(!s) return;
      var p=pgChecked($('start-page-pills'));
      s.innerHTML=p?escHtml(p.label)+(p.cat?' <small>· '+escHtml(p.cat)+'</small>':''):'';
    }

    /* === Idle target: summary row + collapsible radio list === */
    function buildIdleTargetList(){
      var c=$('idle_page_override_target');
      if(!c) return;
      var prev=getIdleTargetValue();
      renderPageList(c,targetablePages(),{mode:'radio',name:'idle_page_target'});
      setIdleTargetValue(prev);
      var sum=$('idle_target_summary');
      if(!sum||sum.dataset.wired==='1') return;
      sum.dataset.wired='1';
      var viaPointer=false, t;
      function setOpen(open,focusWhat){
        clearTimeout(t);
        c.hidden=!open;
        sum.querySelectorAll('.pg-sel,.pg-change').forEach(function(b){ b.setAttribute('aria-expanded',open?'true':'false'); });
        var ch=sum.querySelector('.pg-change');
        if(ch) ch.textContent=open?'Done':'Change';
        if(focusWhat==='radio'){ var r=c.querySelector('input:checked')||c.querySelector('input'); if(r) r.focus(); }
        else if(focusWhat==='button'&&ch) ch.focus();
      }
      sum.addEventListener('click',function(e){
        if(e.target.closest('.pg-sel,.pg-change')) setOpen(c.hidden,c.hidden?'radio':'button');
      });
      c.addEventListener('pointerdown',function(e){ viaPointer=!!e.target.closest('.pg-row'); });
      c.addEventListener('keydown',function(e){
        if(e.key==='Escape'){ e.preventDefault(); setOpen(false,'button'); }
        else viaPointer=false;
      });
      c.addEventListener('change',function(e){
        if(!e.target.closest('.pg-row')) return;
        setIdleTargetValue(parseInt(e.target.value));
        /* Pointer pick: collapse after a beat. Keyboard arrowing keeps it open. */
        if(viaPointer){ clearTimeout(t); t=setTimeout(function(){ setOpen(false,'button'); },250); }
      });
    }

    function getIdleTargetValue(){
      var checked=document.querySelector('input[name="idle_page_target"]:checked');
      return checked?parseInt(checked.value):-1;
    }

    /* -1/unknown falls back to the first row (0). Also refreshes the summary row. */
    function setIdleTargetValue(val){
      pgSelectRadio('idle_page_target',val);
      var c=$('idle_page_override_target');
      pgMarkRadioRow(c);
      var sum=$('idle_target_summary'), p=pgChecked(c);
      if(!sum||!p) return;
      var lbl=sum.querySelector('.pg-sel-label'), cat=sum.querySelector('.pg-sel-cat');
      if(lbl) lbl.textContent=p.label;
      if(cat) cat.textContent=p.cat;
    }

    function onStartPageChange(){
      var v=getStartPageValue();
      /* Live preview: navigate by registry id so image-source Home Pages
         (Moon, Solar, etc.) route correctly. Value still persists via
         getConfigData() on Save. */
      if(v>=0) fetch('/api/navigate?id='+v).catch(function(){});
      pgMarkRadioRow($('start-page-pills'));
      updateStartPageSummary();
      updatePageNavSummary();
    }

    function toggleAutoCycle(){
      var on=$('auto_cycle_toggle').checked;
      if(on && $('idle_page_override_enabled') && $('idle_page_override_enabled').checked){
        $('idle_page_override_enabled').checked=false; toggleIdleOverride();
      }
      if(on && $('home_page_lock') && $('home_page_lock').checked){
        $('home_page_lock').checked=false; toggleHomeLock();
      }
      $('pn_cycle_settings').style.display=on?'flex':'none';
      updatePageNavSummary();
    }

    function toggleHomeLock(){
      var on=$('home_page_lock').checked;
      if(on && $('auto_cycle_toggle') && $('auto_cycle_toggle').checked){
        $('auto_cycle_toggle').checked=false; toggleAutoCycle();
      }
      if(on && $('idle_page_override_enabled') && $('idle_page_override_enabled').checked){
        $('idle_page_override_enabled').checked=false; toggleIdleOverride();
      }
    }

    function updatePageNavSummary(){
      var span=$('pm_summary');
      if(!span) return;
      var cycleOn=$('auto_cycle_toggle').checked;
      if(cycleOn) span.textContent='\u2014 Cycling';
      else {
        var checked=document.querySelector('input[name="start_page"]:checked');
        var label=checked?checked.nextElementSibling.textContent:'';
        span.textContent='\u2014 '+(label||'Summary');
      }
    }

    /* === Filter Colors === */
    let filterColorsArr=[{},{},{}];

    function renderFilterColors(i){
      var container=$('filters_'+i);
      if(!container) return;
      container.innerHTML='';
      var names=Object.keys(filterColorsArr[i]);
      if(!names.length){
        container.innerHTML='<i style="color:var(--text-muted);font-size:0.8rem">No filters detected</i>';
        return;
      }
      names.forEach(name=>{
        var chip=document.createElement('div');
        chip.className='filter-chip';
        var dot=document.createElement('input');
        dot.type='color';
        dot.className='filter-dot';
        dot.value=filterColorsArr[i][name]||'#ffffff';
        dot.addEventListener('input',()=>{filterColorsArr[i][name]=dot.value;checkDirty();});
        var lbl=document.createElement('label');
        lbl.textContent=name;
        chip.appendChild(dot);
        chip.appendChild(lbl);
        container.appendChild(chip);
      });
    }

    /* === Node Labels & Instance States === */
    function updateNodeLabels(){
      var urls=[$('url1').value.trim(),$('url2').value.trim(),$('url3').value.trim()];
      for(var i=0;i<3;i++){
        var label=urls[i]||('N.I.N.A. '+(i+1));
        var hostnameSpan=$('node_card_hostname_'+i);
        if(hostnameSpan) hostnameSpan.textContent=urls[i]?urls[i]:'';
        var instLbl=$('inst_lbl_'+i);
        if(instLbl) instLbl.textContent=label;
        /* Same name in all three page lists (rows share data-arp-idx = registry id). */
        var pgLabel=urls[i]||('NINA '+(i+1));
        $$('.pg-row[data-arp-idx="'+(i+1)+'"] .pg-label').forEach(function(l){ l.textContent=pgLabel; });
      }
      updateInstanceStates();
      updateStartPageSummary();
      if($('idle_target_summary')) setIdleTargetValue(getIdleTargetValue());
      updatePageNavSummary(); /* not updatePageSelectOptions(): a rebuild would reset the labels just set */
    }

    /* Mark page-list rows for a page enabled/disabled: .pg-off + chip text. */
    function pgSetRowsAvail(id,on){
      $$('.pg-row[data-arp-idx="'+id+'"]').forEach(function(row){
        row.classList.toggle('pg-off',!on);
        var ch=row.querySelector('.pg-chip');

      });

    function updateInstanceStates(){
      for(var i=0;i<3;i++){
        var en=$('instance_enabled_'+i).checked;
        var card=$('node_card_'+i);

          if(en) card.classList.remove('node-card-disabled');

    /* === Threshold Helpers === */
    function getThreshObj(pfx,i,defGood,defOk){
      return {
        good_max:parseFloat($(pfx+'_good_max_'+i).value)||defGood,
        ok_max:parseFloat($(pfx+'_ok_max_'+i).value)||defOk,
        good_color:$(pfx+'_good_color_'+i).value,
        ok_color:$(pfx+'_ok_color_'+i).value,
        bad_color:$(pfx+'_bad_color_'+i).value
      };
    }
    function getRmsObj(i){return getThreshObj('rms',i,0.5,1.0)}
    function getHfrObj(i){return getThreshObj('hfr',i,2.0,3.5)}

    function loadThresholds(data,nodeIdx,rmsKey,hfrKey){
      var rmsDef={good_max:0.5,ok_max:1.0,good_color:'#10b981',ok_color:'#eab308',bad_color:'#ef4444'};
      var hfrDef={good_max:2.0,ok_max:3.5,good_color:'#10b981',ok_color:'#eab308',bad_color:'#ef4444'};
      var rms=Object.assign({},rmsDef),hfr=Object.assign({},hfrDef);
      try{if(data[rmsKey]) rms=Object.assign({},rmsDef,JSON.parse(data[rmsKey]));}catch(e){}
      try{if(data[hfrKey]) hfr=Object.assign({},hfrDef,JSON.parse(data[hfrKey]));}catch(e){}
      ['good_max','ok_max','good_color','ok_color','bad_color'].forEach(k=>{
        var re=$('rms_'+k+'_'+nodeIdx);
        var he=$('hfr_'+k+'_'+nodeIdx);
        if(re) re.value=rms[k];
        if(he) he.value=hfr[k];
      });
      updateThresholdBar('rms',nodeIdx);
      updateThresholdBar('hfr',nodeIdx);
    }

    function updateThresholdBar(prefix,nodeIdx){
      var isRms=prefix==='rms';
      var defGood=isRms?0.5:2.0;
      var defOk=isRms?1.0:3.5;
      var goodVal=parseFloat($(prefix+'_good_max_'+nodeIdx).value)||defGood;
      var okVal=parseFloat($(prefix+'_ok_max_'+nodeIdx).value)||defOk;
      var greenFlex=Math.max(goodVal,0.01);
      var yellowFlex=Math.max(okVal-goodVal,0.01);
      var redFlex=Math.max(okVal*0.5,yellowFlex,0.01);
      var segGood=$(prefix+'_seg_good_'+nodeIdx);
      var segOk=$(prefix+'_seg_ok_'+nodeIdx);
      var segBad=$(prefix+'_seg_bad_'+nodeIdx);
      if(segGood) segGood.style.flex=''+greenFlex;
      if(segOk)   segOk.style.flex=''+yellowFlex;
      if(segBad)  segBad.style.flex=''+redFlex;
      var labelsEl=$(prefix+'_labels_'+nodeIdx);
      if(labelsEl){
        labelsEl.innerHTML='<span>0.0</span><span>'+goodVal.toFixed(1)+' (Good)</span><span>'+okVal.toFixed(1)+' (Warn)</span><span>Bad</span>';
      }
    }

    /* === Rotation slideshow list === */
    /* Single ordered slideshow list: membership == order, held in _arpOrder
       (stop ids 0..11, 24=JSON, 25=HA, 26=OctoPrint, 27=Radar, 28=Cloud Cover).
       Saved array = checked ids in cycle order, padded to 24 slots with 0xFF
       (255 = unused). */
    function getRotateOrder(){
      var order=_arpOrder.slice(); /* every checkbox flip writes _arpOrder, so it is the truth */
      while(order.length<24/* keep in sync with ARP_ORDER_CAPACITY in app_config.h (24 since v63) */) order.push(255);
      return order.slice(0,24/* keep in sync with ARP_ORDER_CAPACITY in app_config.h (24 since v63) */);
    }

    function setRotateOrder(orderArr){
      if(!orderArr) return;
      /* Members (in order) = valid stop ids that are not the 0xFF/255 sentinel.
         Keep in sync with ARP_STOP_IS_VALID in app_config.h. */
      var members=orderArr.map(function(v){return parseInt(v);}).filter(function(v){return !isNaN(v)&&(v>=0&&v<12||v===24||v===25||v===26||v===27||v===28||v===29);});
      _arpOrder.length=0;
      members.forEach(function(id){ if(_arpOrder.indexOf(id)<0) _arpOrder.push(id); });
      var c=$('arp-container');
      if(c) c.querySelectorAll('.pg-row').forEach(function(row){
        var cb=row.querySelector('input[type="checkbox"]');
        if(cb) cb.checked=_arpOrder.indexOf(parseInt(row.getAttribute('data-arp-idx')))>=0;
      });
      renumberArp();
    }

    /* Those two tabs apply their edits as an unsaved preview while you work;
       Save is what stores them. Each fragment publishes a hook that returns a
       promise to store its whole page config, or null when the tab was never
       opened or nothing changed. A rejection here fails the Save so the error
       is surfaced rather than silently dropped. */
    function savePageFragments(){
      var jobs=[];
      [window.jdCollectAndSave,window.haCollectAndSave].forEach(function(hook){
        if(typeof hook!=='function') return;
        var p=hook();
        if(p) jobs.push(p);
      });
      return Promise.all(jobs);
    }

    /* Discard counterpart: /api/config/revert restores the config blob but not
       the JSON/HA tile caches, so a page previewing unsaved tiles would keep
       showing them. Each fragment puts its own last-stored config back. */
    function revertPageFragments(){
      var jobs=[];
      [window.jdRevertPreview,window.haRevertPreview].forEach(function(hook){
        if(typeof hook!=='function') return;
        var p=hook(false);
        if(p) jobs.push(p);
      });
      return Promise.all(jobs);
    }

    function getConfigData(){
      var data=_cfgCache?structuredClone(_cfgCache):{};
      TAB_ORDER.forEach(function(name){
        if(loadedTabs.has(name)) COLLECT_TAB_FNS[name](data);
      });
      return data;

    /* === Touched-Keys Payload ===
       Post ONLY the keys this browser tab's user actually edited. getConfigData()
       seeds from a cached server snapshot (_cfgCache) that goes stale the moment
       anything else writes the config -- the Control API, MQTT, another browser
       tab, a per-feature endpoint. Posting the whole object (or anything derived
       from the stale cache) snaps those values back; a second tab live-applying
       a Home Page change used to be undone by the first tab's next keystroke.
       Keys absent from the POST keep their current device value, so untouched
       settings can never be clobbered.

       Two sources, unioned:
         - value diff against `loadedConfig`, the baseline snapshot taken right
           after populate and refreshed on every successful Save/Discard;
         - `_touched`, ids the user physically interacted with (most controls
           have id == config key), so a value the user deliberately set BACK to
           the baseline still goes out even though it diffs clean.
       `_touched` entries that are not real config keys (control ids like
       'theme_select', action fields) are filtered by the `k in data` test --
       `data` only ever holds real config keys.

       There is no whole-form fallback: with no baseline we post only the
       explicitly touched keys. */
    const _touched=new Set();
    /* Form snapshot at the last user edit; markTouched() diffs against it to
       map edits to real config keys. null = re-seed from loadedConfig. */
    var _prevSnap=null;
    function touchedPayload(data){
      var base=null;
      try{ if(loadedConfig) base=JSON.parse(loadedConfig); }catch(e){}
      var out={};
      if(base){
        Object.keys(data).forEach(function(k){
          if(!(k in base)||JSON.stringify(data[k])!==JSON.stringify(base[k])) out[k]=data[k];
        });
      }
      _touched.forEach(function(k){ if(k in data) out[k]=data[k]; });
      return out;
    }

    /* === Config Load === */
    let loadedConfig='';
    let _populating=false;
    /* Last _dirty flag reported by /api/config: the device is holding a
       live-applied but unsaved change (possibly made from another browser tab).
       Keeps the Save bar up even when this tab has touched nothing.
       /api/status carries no dirty flag, so this refreshes on populate only. */
    var _deviceDirty=false;

    /* Fold ONE tab's freshly populated values into the baseline.
       The baseline is snapshotted once, in populateConfig(), and only runs the
       collectors of tabs already loaded at that instant (the boot tab). Every
       lazily-loaded/prefetched fragment populates later, and any key whose
       collector output does not round-trip _cfgCache byte-identically would then
       diff 'changed' forever and ride every Save from every tab -- e.g.
       collectTab_system emits wifi_networks [{ssid}] while GET /api/config emits
       [{ssid,password:'********'}], which the device reads as an SSID change and
       answers by erasing the stored password. A tab that has only just populated
       has not been touched by the user, so its collected values are unedited by
       definition and belong in the baseline.
       Merge only this tab's keys: re-snapshotting the whole form here would adopt
       (and thereby discard) edits pending in other tabs. */
    function baselineAdoptTab(name){
      if(!loadedConfig||!COLLECT_TAB_FNS[name]) return;
      try{
        var base=JSON.parse(loadedConfig), tab={};
        COLLECT_TAB_FNS[name](tab);
        Object.keys(tab).forEach(function(k){ base[k]=tab[k]; });
        loadedConfig=JSON.stringify(base);
      }catch(e){ console.error('baselineAdoptTab('+name+') failed',e); }
    }

    /* === Per-Tab Config Populators ===
       Mirror image of the collectors above: one populate function per tab,
       each setting only the DOM it owns. Split out of the old monolithic
       populateConfig so a tab can be populated the moment its fragment
       finishes loading (see loadTabFragment() above) instead of requiring
       every tab's markup to already exist. As of P6d every tab is a lazily
       loaded fragment: populateConfig()'s TAB_ORDER.forEach below only calls
       a tab's populator once that tab is in loadedTabs, and loadTabFragment()
       makes the matching direct call the moment a tab's fragment is
       injected -- between the two, every tab still ends up populated exactly
       once per fragment load / per config reload, whichever tab order the
       user actually opens them in. */

    function populateTab_nodes(data){
      /* Build the per-instance node cards first (P6d: tab-nodes is now a
         lazily-loaded fragment, so #node-cards is empty until this runs). */
      buildNodeCards();
      function extractHost(url){
        if(!url) return '';
        var m=url.match(/^https?:\/\/([^:/]+)/);
        return m?m[1]:'';
      }
      $('url1').value=extractHost(data.url1);
      $('url2').value=extractHost(data.url2);
      $('url3').value=extractHost(data.url3);
      $('update_rate').value=data.update_rate_s||2;
      $('graph_interval').value=data.graph_update_interval_s||5;
      $('connection_timeout').value=data.connection_timeout_s||6;
      $('instance_enabled_0').checked=data.instance_enabled_1!==false;
      $('instance_enabled_1').checked=data.instance_enabled_2!==false;
      $('instance_enabled_2').checked=data.instance_enabled_3!==false;
      $('idle_poll_interval').value=data.idle_poll_interval_s||30;
      $('toast_instance_muted_0').checked=!!data.toast_instance_muted_1;
      $('toast_instance_muted_1').checked=!!data.toast_instance_muted_2;
      $('toast_instance_muted_2').checked=!!data.toast_instance_muted_3;
      $('alert_voice_muted_0').checked=!!data.alert_voice_muted_1;
      $('alert_voice_muted_1').checked=!!data.alert_voice_muted_2;
      $('alert_voice_muted_2').checked=!!data.alert_voice_muted_3;

      for(var i=0;i<3;i++){
        var key='filter_colors_'+(i+1);
        try{filterColorsArr[i]=data[key]?JSON.parse(data[key]):{};}catch(e){filterColorsArr[i]={};}
        renderFilterColors(i);
      }

      loadThresholds(data,0,'rms_thresholds_1','hfr_thresholds_1');
      loadThresholds(data,1,'rms_thresholds_2','hfr_thresholds_2');
      loadThresholds(data,2,'rms_thresholds_3','hfr_thresholds_3');

      /* Cross-tab: stamps the NINA labels and enabled/disabled state from the
         Nodes-tab fields just set above onto the Behavior tab's page-list
         rows (all three lists). populateTab_behavior() runs later in
         TAB_ORDER and rebuilds those lists from the registry, overwriting the
         Home Page selection with the real server value; matches the original
         monolith, which called updateNodeLabels() at this same relative
         point, well before its final setStartPageValue() call. */
      updateNodeLabels();
    }

    async function populateTab_behavior(data){
      /* P6d: tab-behavior is now a lazily-loaded fragment. #arp-container's
         rotation list (buildArpPills) and #start-page-pills /
         #idle_page_override_target (populatePageControls, page-registry
         driven) must be (re)built here every time this tab populates --
         populateConfig()'s unconditional populatePageControls() call at its
         top only reaches these elements when this fragment is already
         loaded by then. buildArpPills() has no registry dependency and runs
         first so setRotateOrder() below always has rows to select from;
         populatePageControls() awaits the (cached, near-instant after boot)
         page registry fetch before building the Home Page and idle target
         lists that setStartPageValue()/setIdleTargetValue() need, and stamps
         availability chips onto the rotation rows. All of them
         clear-then-rebuild, so re-running them on every populate (including
         a config reload) is safe. */
      buildArpPills();
      await fetchPageRegistry();
      populatePageControls();
      $('toast_duration').value=data.toast_duration_s||8;
      $('alert_flash_enabled').checked=data.alert_flash_enabled!==false;
      $('alert_voice_enabled').checked=!!data.alert_voice_enabled;
      $('boot_jingle_enabled').checked=!!data.boot_jingle_enabled;
      var vVol=data.alert_voice_volume!=null?data.alert_voice_volume:90;
      $('alert_voice_volume').value=vVol;
      $('alert_voice_volume_val').textContent=vVol+'%';
      var vMask=data.alert_voice_types!=null?data.alert_voice_types:7;
      for(var vb=0;vb<3;vb++){$('alert_voice_type_'+vb).checked=!!(vMask&(1<<vb));}
      $('alert_voice_repeat_min').value=data.alert_voice_repeat_min!=null?data.alert_voice_repeat_min:5;
      $('alert_voice_brief').checked=!!data.alert_voice_brief;
      $('alert_voice_conn').checked=!!data.alert_voice_conn;
      $('alert_voice_disc').checked=data.alert_voice_disc!=null?!!data.alert_voice_disc:true;
      var aggWin=data.toast_aggregation_window_s!=null?data.toast_aggregation_window_s:5;
      $('toast_aggregation_window').value=aggWin;
      updateAggregationLabel(aggWin);
      var mask=data.toast_notify_mask!=null?data.toast_notify_mask:0xFFFFFFFF;
      for(var i=0;i<12;i++){$('notify_cat_'+i).checked=!!(mask&(1<<i));}
      var vcMask=data.voice_notify_mask!=null?data.voice_notify_mask:0x1A2;
      for(var vc=0;vc<12;vc++){$('voice_cat_'+vc).checked=!!(vcMask&(1<<vc));}

      $('auto_cycle_toggle').checked=!!data.auto_rotate_enabled;
      toggleAutoCycle();

      $('auto_rotate_interval').value=data.auto_rotate_interval_s||30;
      $('auto_rotate_effect').value=data.auto_rotate_effect||0;
      $('auto_rotate_skip').checked=!!data.auto_rotate_skip_disconnected;
      if($('nav_grace_s')) $('nav_grace_s').value=(data.nav_grace_s||10);
      if(data.auto_rotate_order2) setRotateOrder(data.auto_rotate_order2);

      if($('idle_page_override_enabled')) $('idle_page_override_enabled').checked=!!data.idle_page_override_enabled;
      setIdleTargetValue(data.idle_page_override_target!=null?data.idle_page_override_target:0);
      if($('idle_indicator_enabled')) $('idle_indicator_enabled').checked=data.idle_indicator_enabled!==false;
      toggleIdleOverride();

      // Home Page lock — raw state from data, set after toggleAutoCycle()/
      // toggleIdleOverride() so the mutual-exclusion handlers cannot clear it
      // during load. The server normalizes exclusivity, so no handler call is
      // needed here (the lock has no dependent controls to show/hide).
      if($('home_page_lock')) $('home_page_lock').checked=!!data.home_page_lock;

      // Home Page list was just (re)built above by populatePageControls().
      // active_page_override is a registry id after migration (never -1);
      // default to 0 if absent.
      setStartPageValue(data.active_page_override!=null?data.active_page_override:0);
      updatePageNavSummary();

    function populateTab_system(data){
      /* P6d: tab-system is now a lazily-loaded fragment. The firmware/build
         info grid (#fw_version etc.) is filled by loadVersion(), which is
         normally kicked off once at boot (see the Init section at the
         bottom of this file) -- but that first call races the System
         fragment's own lazy load, and loadVersion() only ever runs that
         once. Call it again here (guarded internally, safe to repeat) so
         the grid is populated whenever this tab's fragment becomes present,
         regardless of which happened first. */
      if(typeof loadVersion==='function') loadVersion();
      $('hostname').value=data.hostname||'';
      if(data.wifi_networks && data.wifi_networks.length) {
        for(var i=0;i<3;i++) {
          var n=data.wifi_networks[i]||{};
          $('ssid'+(i+1)).value=n.ssid||'';
          $('pass'+(i+1)).value='';

      } else {
        $('ssid1').value=data.ssid||'';

        $('ssid2').value='';$('pass2').value='';
        $('ssid3').value='';$('pass3').value='';

      $('ntp').value=data.ntp||'';
      $('timezone').value=data.timezone||'';
      // passwords cleared in the wifi_networks block above

      $('debug_mode').checked=!!data.debug_mode;
      $('demo_mode').checked=!!data.demo_mode;
      $('wifi_power_save').checked=data.wifi_power_save!==false;
      /* _prev is the value txPowerChanged() restores when the user declines the
         lockout warning; seed it here so a decline before any accepted change
         still has somewhere to go back to. */
      var txSel=$('wifi_max_tx_dbm');
      txSel.value=data.wifi_max_tx_dbm||0;
      txSel._prev=txSel.value;
      $('deep_sleep_enabled').checked=!!data.deep_sleep_enabled;
      $('deep_sleep_wake_timer').value=Math.round((data.deep_sleep_wake_timer_s||0)/3600);
      $('deep_sleep_on_idle').checked=!!data.deep_sleep_on_idle;
      $('auto_update_check').checked=data.auto_update_check!==false;
      $('update_channel').value=data.update_channel||0;

      var mqttUrl=data.mqtt_broker_url||'';
      var mqttMatch=mqttUrl.match(/^mqtt:\/\/(.+)/);
      $('mqtt_broker').value=mqttMatch?mqttMatch[1]:'';
      $('mqtt_port').value=data.mqtt_port||1883;
      $('mqtt_user').value=data.mqtt_username||'';
      $('mqtt_pass').value=data.mqtt_password||'';
      $('mqtt_prefix').value=data.mqtt_topic_prefix||'';
      $('mqtt_enabled').checked=!!data.mqtt_enabled;

      /* weather_lat/weather_lon live on this tab's Location card and double
         as the Image Display tab's moon widget coordinates -- there is no
         separate moon_lat/moon_lon control (see the matching note in
         collectTab_system). Falls back to a previously configured moon-only
         location for devices upgraded from before the shared field existed. */
      var wlat=data.weather_lat, wlon=data.weather_lon;
      if((!wlat && !wlon) && (data.moon_lat || data.moon_lon)){ wlat=data.moon_lat; wlon=data.moon_lon; }
      if($('weather_lat')) $('weather_lat').value=wlat||'';
      if($('weather_lon')) $('weather_lon').value=wlon||'';

      // Authentication toggle — reflect in UI and hide sign-out button when off
      var authOn = (data.auth_enabled!==false);
      if($('auth_enabled')) $('auth_enabled').checked = authOn;
      if($('signOutBtn')) $('signOutBtn').style.display = authOn ? '' : 'none';

    const POPULATE_TAB_FNS={
      nodes: populateTab_nodes,
      allsky: populateTab_allsky,
      /* json and ha define their populators inside their own fragments' inline
         scripts (see activateFragmentScripts), so these two are looked up on
         window at call time -- the shell does not declare them. The lookup
         always succeeds when it matters: loadTabFragment() runs the fragment's
         script before it calls the populator, and populateConfig() only calls
         a tab's populator once that tab is in loadedTabs. */
      json: function(d){ if(window.populateTab_json) window.populateTab_json(d); },
      ha: function(d){ if(window.populateTab_ha) window.populateTab_ha(d); },
      clock: populateTab_clock,
      spotify: populateTab_spotify,
      'image-goes': populateTab_image_goes,
      'image-moon': populateTab_image_moon,
      'image-solar': populateTab_image_solar,
      'image-custom': populateTab_image_custom,
      'image-radar': populateTab_image_radar,
      'image-clouds': populateTab_image_clouds,
      octoprint: populateTab_octoprint,
      adsb: populateTab_adsb,
      display: populateTab_display,
      behavior: populateTab_behavior,
      /* Voice Clips has no config fields; its "populate" just (re)builds the
         static clip rows after each fragment injection. The builder lives in
         the fragment's own inline script (like json/ha), so look it up on
         window at call time. No network I/O here -- fragments may be
         idle-prefetched, and the clip-state fetch runs only on activation
         (see switchTab's voice-clips hook). */
      'voice-clips': function(){ if(window.vcBuildRows) window.vcBuildRows(); },
      system: populateTab_system,
      logs: populateTab_logs,
      backup: populateTab_backup,
      api: populateTab_api
    };

    async function populateConfig(data){
      _populating=true;
      /* Async ordering: load the page registry FIRST so the Home Page pills and
         the idle target dropdown options exist before any per-tab populate runs.
         populateConfig is awaited by loadConfig(); every per-tab populate below
         (including populateTab_nodes' updateNodeLabels() call and
         populateTab_behavior's own list value-set) can safely assume
         the registry-driven controls already exist. */
      await fetchPageRegistry();
      populatePageControls();
      if(!_pageRegistry.length) retryPageRegistry(10);

      var hn=data.hostname||'NINA Display';
      $('brandName').textContent=hn;
      document.title=hn;

      /* Same async trap as loadTabFragment: populateTab_behavior returns a
         promise and only sets its values after awaiting the page registry, so
         snapshotting the baseline right after this loop would capture the
         fragment's raw HTML defaults. Collect what each populator returns and
         let them all settle first. Each is given its own .catch (mirroring the
         per-tab try/catch that already handles a sync throw), so one failing tab
         records _populateFailed without aborting the others. */
      var pending=[];
      TAB_ORDER.forEach(function(name){
        if(!loadedTabs.has(name)) return;
        try{ pending.push(Promise.resolve(POPULATE_TAB_FNS[name](data)).catch(function(e){
          console.error('populateTab_'+name+' failed',e);
          _populateFailed=true;
        })); }
        catch(e){
          console.error('populateTab_'+name+' failed',e);
          _populateFailed=true;
        }
      });
      await Promise.all(pending);
      if(_populateFailed){ cfgOverlay('error'); }
      else cfgOverlay('hide');

      loadedConfig=JSON.stringify(getConfigData());
      _prevSnap=null;  /* re-seed the markTouched diff from the fresh baseline */
      _populating=false;
      /* The device holding an unsaved live-applied change raises the Save bar
         (see checkDirty) but must NOT widen the POST body: dropping the
         baseline here used to make the next keystroke post the whole stale
         form, clobbering whatever another tab had just applied. */
      _deviceDirty=!!data._dirty;
      checkDirty();
    }

    /* === City Lookup === */
    async function lookupCity(){
      var query=$('weather_location_search').value.trim();
      if(!query) return;
      var resultsDiv=$('city_results');
      resultsDiv.style.display='block';
      resultsDiv.innerHTML='<div style="padding:8px;color:#888;">Searching...</div>';
      try{
        var resp=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=5&language=en');
        var data=await resp.json();
        if(!data.results||data.results.length===0){
          resultsDiv.innerHTML='<div style="padding:8px;color:#888;">No results found</div>';
          return;
        }
        resultsDiv.innerHTML='';
        data.results.forEach(function(r){
          var div=document.createElement('div');
          div.style.cssText='padding:8px;cursor:pointer;border-bottom:1px solid #333;';
          div.textContent=r.name+(r.admin1?', '+r.admin1:'')+', '+r.country;
          div.onmouseover=function(){div.style.background='#333';};
          div.onmouseout=function(){div.style.background='transparent';};
          div.onclick=function(){
            $('weather_lat').value=r.latitude.toFixed(4);
            $('weather_lon').value=r.longitude.toFixed(4);
            /* weather_location_name lives on the (lazily-loaded) Clock tab
               fragment -- guard the write since this button is on System
               and Clock may never have been activated this session. */
            if($('weather_location_name')) $('weather_location_name').value=r.name+(r.admin1?', '+r.admin1:'');
            resultsDiv.style.display='none';
            checkDirty();
          };
          resultsDiv.appendChild(div);
        });
      }catch(e){
        resultsDiv.innerHTML='<div style="padding:8px;color:#f44;">Lookup failed: '+e.message+'</div>';
      }
    }

    function scanWifi(){
      window._wifiScanned=true;
      var list=$('wifiScanList');
      var status=$('wifiScanStatus');
      list.classList.remove('collapsed');
      $('scanChevron').classList.remove('collapsed');
      status.style.display='';
      status.textContent='Scanning for networks...';
      var rows=list.querySelectorAll('.wifi-scan-row');
      for(var i=0;i<rows.length;i++) rows[i].remove();
      var old=$('wifiScanFooter');if(old)old.remove();
      fetch('/api/wifi/scan').then(function(r){return r.json()}).then(function(data){
        renderScanResults(data);
      }).catch(function(e){
        status.textContent='Scan failed. Try again.';
        status.style.display='';
      });
    }

    function renderScanResults(data){
      var list=$('wifiScanList');
      var status=$('wifiScanStatus');
      var rows=list.querySelectorAll('.wifi-scan-row');
      for(var i=0;i<rows.length;i++) rows[i].remove();
      var old=$('wifiScanFooter');if(old)old.remove();
      if(!data.networks||data.networks.length===0){
        status.textContent='No networks found.';
        status.style.display='';
        return;
      }
      status.style.display='none';
      for(var i=0;i<data.networks.length;i++){
        var n=data.networks[i];
        var row=document.createElement('div');
        row.className='wifi-scan-row'+(n.compatible?'':' incompatible');
        var bars=getSignalBars(n.rssi,n.compatible);
        var left='<div class="wifi-scan-row-left">'+bars+'<div><div class="wifi-scan-ssid">'+escHtml(n.ssid)+'</div><div class="wifi-scan-meta">'+escHtml(n.auth)+' &middot; Ch '+n.channel+' &middot; '+n.rssi+' dBm</div></div></div>';
        if(n.compatible){
          row.innerHTML=left;
          var btn=document.createElement('button');
          btn.className='wifi-scan-select';
          btn.textContent='Select';
          (function(ssid){btn.addEventListener('click',function(){selectNetwork(ssid)})})(n.ssid);
          row.appendChild(btn);
        }else{
          row.innerHTML=left+'<span class="wifi-scan-badge">INCOMPATIBLE</span>';
        }
        list.appendChild(row);
      }
      var footer=document.createElement('div');
      footer.className='wifi-scan-footer';
      footer.id='wifiScanFooter';
      var txt=data.count+' network'+(data.count!==1?'s':'')+' found';
      if(data.incompatible_count>0) txt+=' &middot; '+data.incompatible_count+' incompatible';
      footer.innerHTML=txt;
      list.appendChild(footer);
    }

    function getSignalBars(rssi,compatible){
      var bars=rssi>=-50?4:rssi>=-70?3:2;
      var color=!compatible?'#666':bars>=4?'#4caf50':bars>=3?'#ff9800':'#f44336';
      var inactive='rgba(255,255,255,0.15)';
      var heights=[4,8,12,16];
      var html='<div class="wifi-scan-signal">';
      for(var i=0;i<4;i++){
        html+='<span style="height:'+heights[i]+'px;background:'+(i<bars?color:inactive)+'"></span>';
      }
      return html+'</div>';
    }

    function selectNetwork(ssid){
      var slots=['ssid1','ssid2','ssid3'];
      var target=null;
      for(var i=0;i<slots.length;i++){
        if(!$(slots[i]).value.trim()){target=i;break;}
      }
      if(target===null) target=2;
      $(slots[target]).value=ssid;
      $('pass'+(target+1)).value='';
      $('pass'+(target+1)).focus();
      checkDirty();
    }

    function toggleScanPanel(){
      var list=$('wifiScanList');
      var chev=$('scanChevron');
      list.classList.toggle('collapsed');
      chev.classList.toggle('collapsed');
      /* Scan lazily on the first unfurl of "Available Networks" (the ~4.7s scan
         is no longer fired on page load). Manual Rescan still works regardless. */
      if(!list.classList.contains('collapsed') && !window._wifiScanned && typeof scanWifi==='function') scanWifi();
    }

    function loadConfig(){
      /* Returns the chain so init can defer heavy startup work after populate.
         scanWifi() is no longer fired here; it runs lazily on first unfurl of the
         "Available Networks" panel. Forces a fresh GET (bypassing _cfgCache) since
         this is the authoritative load path -- initial page load and post-revert
         reload both need the server's current state, not a stale cached copy.
         On failure (freshly booted device can drop the first request) keep
         retrying: until a config load succeeds every save path is blocked (see
         configLoadedGuard), so the page must not sit un-populated forever. */
      return fetchConfig(true).then(populateConfig).catch(function(e){
        console.error('Failed to load config',e);
        if(!window._cfgLoadToastShown){
          window._cfgLoadToastShown=true;
          showToast('Could not load settings from device. Retrying.','error');
        }
        cfgOverlay('retry');
        setTimeout(loadConfig,3000);
      });
    }
    /* Central guard for every path that POSTs the full config payload. A null
       _cfgCache means getConfigData() would seed from {} and collect empty DOM
       fields from loaded fragments -- saving that wipes device settings
       (WiFi, hostname, MQTT). Fail closed. */
    function configLoadedGuard(){
      if(_cfgCache && !_populateFailed) return true;
      if(_populateFailed) showToast('Some settings failed to load - refresh the page before saving','error');
      else showToast('Settings not loaded from device yet. Still retrying, please wait.','error');
      return false;
    }

    /* === Settings-load overlay ===
       Covers the UI from page open until the config has loaded AND every
       loaded tab populated without throwing. Three states: 'loading' (spinner),
       'retry' (first fetch failed, loadConfig is retrying), 'error' (a tab's
       populate threw -- fields on screen may be blank/stale; only a page
       refresh recovers). While visible, saving is already blocked by
       configLoadedGuard()/_populateFailed. */
    var _populateFailed=false;
    function cfgOverlay(state){
      var el=document.getElementById('cfg-load-overlay');
      if(!el){
        el=document.createElement('div');
        el.id='cfg-load-overlay';
        el.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,12,16,0.88);backdrop-filter:blur(3px);color:#dfe5ee;font-size:1rem;text-align:center;padding:24px';
        el.innerHTML='<div class="spinner" id="cfg-load-spin" style="width:34px;height:34px;border:3px solid rgba(255,255,255,0.2);border-top-color:#7ab7ff;border-radius:50%;animation:spin 0.9s linear infinite"></div>'+
          '<div id="cfg-load-msg"></div>'+
          '<button type="button" class="btn" id="cfg-load-refresh" style="display:none" onclick="location.reload()">Refresh Page</button>';
        document.body.appendChild(el);
      }
      var msg=document.getElementById('cfg-load-msg');
      var spin=document.getElementById('cfg-load-spin');
      var btn=document.getElementById('cfg-load-refresh');
      if(state==='hide'){ el.style.display='none'; return; }
      el.style.display='flex';
      if(state==='loading'){ msg.textContent='Loading settings from device...'; spin.style.display=''; btn.style.display='none'; }
      else if(state==='retry'){ msg.textContent='Device not answering yet - retrying...'; spin.style.display=''; btn.style.display='none'; }
      else if(state==='error'){ msg.textContent='Some settings failed to load. Refresh the page before making changes.'; spin.style.display='none'; btn.style.display=''; }
    }

    /* === Version Load === */
    function loadVersion(){
      /* P6d: tab-system (where the whole #fw_* grid lives) is now a lazily
         loaded fragment, so these elements may not exist yet the first time
         this runs (boot fires it unconditionally -- see Init below -- before
         the user has necessarily opened System). Every write is guarded;
         populateTab_system() calls this again once the fragment is present
         so the grid still ends up populated. */
      fetchJsonMemo('/api/version').then(data=>{
        if($('fw_version')) $('fw_version').textContent=data.version||'--';
        if($('fw_date')) $('fw_date').textContent=(data.date||'--')+' '+(data.time||'');
        if($('fw_idf')) $('fw_idf').textContent=data.idf||'--';
        if($('fw_partition')) $('fw_partition').textContent=data.partition||'--';

        var ghBase='https://github.com/chvvkumar/ESP32-P4-NINA-Display/';
        var tagEl=$('fw_git_tag');
        if(tagEl){
          tagEl.textContent='';
          var releaseTag=data.version?'v'+data.version:data.git_tag;
          if(releaseTag&&releaseTag!=='unknown'){
            var a=document.createElement('a');
            a.href=ghBase+'releases/tag/'+encodeURIComponent(releaseTag);
            a.target='_blank'; a.rel='noopener'; a.className='accent-link';
            a.textContent=releaseTag;
            tagEl.appendChild(a);
          }else{
            tagEl.textContent=releaseTag||'--';
          }
        }

        var shaEl=$('fw_git_sha');
        if(shaEl){
          shaEl.textContent='';
          if(data.git_sha&&data.git_sha!=='unknown'){
            var a=document.createElement('a');
            a.href=ghBase+'commit/'+encodeURIComponent(data.git_sha);
            a.target='_blank'; a.rel='noopener'; a.className='mono-link';
            a.textContent=data.git_sha.substring(0,8);
            shaEl.appendChild(a);
          }else{
            shaEl.textContent=data.git_sha||'--';
          }
        }
      }).catch(e=>console.error('Failed to load version',e));
    }

    /* === Toast === */
    /* Severity is carried by a small inline SVG (check / cross / dot) rather
       than a colored edge on the box. */
    var TOAST_ICONS={
      success:'<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.8 7.8a1 1 0 01-1.4 0L3.3 10.3a1 1 0 111.4-1.4l3.5 3.5 7.1-7.1a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>',
      error:'<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.3 5.3a1 1 0 011.4 0L10 8.6l3.3-3.3a1 1 0 111.4 1.4L11.4 10l3.3 3.3a1 1 0 01-1.4 1.4L10 11.4l-3.3 3.3a1 1 0 01-1.4-1.4L8.6 10 5.3 6.7a1 1 0 010-1.4z" clip-rule="evenodd"/></svg>',
      info:'<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 2.5a7.5 7.5 0 100 15 7.5 7.5 0 000-15zM9 9a1 1 0 012 0v5a1 1 0 01-2 0V9zm1-3.6a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2z" clip-rule="evenodd"/></svg>'

    function showToast(msg,type){

      t.querySelector('.toast-msg').textContent=msg;

    /* === Save / Discard / Reboot / Reset === */
    function save(){
      if(!configLoadedGuard()) return;
      var btn=$('saveBtn');
      btn.disabled=true; btn.textContent='Saving...';
      /* Touched keys only: a typed WiFi password changes wifi_networks vs the
         baseline (whose pass fields populate empty), so it rides along
         naturally; untouched keys stay out and cannot clobber the device. */
      postJson('/api/config',touchedPayload(getConfigData())).then(r=>{
        if(!r.ok) throw new Error('Save failed');
        return r.text();
      }).then(()=>savePageFragments()).then(()=>{
        _touched.clear();
        invalidateConfigCache();
        showToast('Settings saved','success');
        $('saveBar').classList.remove('visible');
        /* Re-read from the device rather than re-snapshotting the local form:
           the save may have merged with changes made elsewhere, and _cfgCache
           plus the baseline must both come back fresh. */
        loadConfig();
      }).catch(e=>{
        showToast('Save failed: '+e.message,'error');
      }).finally(()=>{
        btn.disabled=false; btn.textContent='Save';
      });
    }

    /* === Confirm popover: replaces window.confirm() ===
       askConfirm(anchorEl, {title, body, fine, ok, tone, hold}) -> Promise<boolean>.
       Anchored above the trigger (flips below when cramped), one at a time,
       click-away / Esc cancel, hold:true needs the OK button held ~1.2 s. */
    var _cfm=null;
    function askConfirm(anchor,o){
      if(_cfm) _cfm.done(false);
      if(!anchor){
        try{ var ev=window.event, t=ev&&(ev.currentTarget||ev.target); anchor=t&&t.closest?(t.closest('button,select,input,label')||t):null; }catch(e){ anchor=null; }
      }
      if(anchor&&!(anchor instanceof Element)) anchor=null;
      var catcher=document.createElement('div'); catcher.className='cfm-catch';
      var pop=document.createElement('div'); pop.className='cfm';
      pop.setAttribute('role','dialog'); pop.setAttribute('aria-modal','true');
      pop.dataset.tone=o.tone||'neutral';
      pop.innerHTML='<div class="cfm-title">'+escHtml(o.title||'')+'</div>'+
        (o.body?'<div class="cfm-body">'+escHtml(o.body)+'</div>':'')+
        (o.fine?'<div class="cfm-fine">'+escHtml(o.fine)+'</div>':'')+
        '<div class="cfm-actions"><button type="button" class="btn btn-outline cfm-cancel">Cancel</button>'+
        '<button type="button" class="btn '+(o.tone==='danger'?'btn-danger':'btn-primary')+' cfm-ok">'+
        '<span class="cfm-fill"></span><span class="cfm-lbl">'+escHtml(o.ok||'OK')+'</span></button></div>';
      document.body.appendChild(catcher); document.body.appendChild(pop);
      var okBtn=pop.querySelector('.cfm-ok'), cancelBtn=pop.querySelector('.cfm-cancel');
      var resolve, p=new Promise(function(r){ resolve=r; });
      function place(){
        var w=pop.offsetWidth, h=pop.offsetHeight, vw=window.innerWidth, vh=window.innerHeight, x, y;
        if(anchor&&anchor.isConnected){
          var r=anchor.getBoundingClientRect(), cx=r.left+r.width/2;
          var above=(r.top-h-12>=8)||(r.bottom+h+12>vh);
          y=above?r.top-h-12:r.bottom+12;
          x=Math.max(8,Math.min(cx-w/2,vw-w-8));
          pop.className='cfm '+(above?'above':'below');
          pop.style.setProperty('--cfm-caret',Math.max(14,Math.min(cx-x,w-14))+'px');
        }else{
          x=(vw-w)/2; y=(vh-h)/2; pop.className='cfm';
        }
        pop.style.left=x+'px'; pop.style.top=Math.max(8,y)+'px';
      }
      function done(v){
        if(_cfm!==me) return;
        _cfm=null;
        window.removeEventListener('scroll',place,true); window.removeEventListener('resize',place);
        document.removeEventListener('keydown',onKey,true);
        catcher.remove(); pop.remove();
        try{ if(anchor&&anchor.focus) anchor.focus({preventScroll:true}); }catch(e){}
        resolve(v);
      }
      function onKey(e){
        if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(false); }
        else if(e.key==='Tab'){ e.preventDefault(); (document.activeElement===okBtn?cancelBtn:okBtn).focus(); }
      }
      var me={done:done}; _cfm=me;
      catcher.addEventListener('click',function(){ done(false); });
      cancelBtn.addEventListener('click',function(){ done(false); });
      if(o.hold){
        var HOLD=1200, fill=okBtn.querySelector('.cfm-fill'), timer=null;
        var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var start=function(e){
          if(timer) return;
          if(e.pointerId!==undefined&&okBtn.setPointerCapture){ try{ okBtn.setPointerCapture(e.pointerId); }catch(x){} }
          if(!reduce){ fill.style.transition='width '+HOLD+'ms linear'; fill.style.width='100%'; }
          timer=setTimeout(function(){ fill.style.transition='none'; fill.style.width='100%'; done(true); },HOLD);
        };
        var stop=function(){
          if(!timer) return;
          clearTimeout(timer); timer=null;
          fill.style.transition='none'; fill.style.width='0';
        };
        okBtn.addEventListener('pointerdown',function(e){ e.preventDefault(); start(e); });
        ['pointerup','pointerleave','pointercancel'].forEach(function(t){ okBtn.addEventListener(t,stop); });
        okBtn.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!e.repeat) start(e); } });
        okBtn.addEventListener('keyup',function(e){ if(e.key==='Enter'||e.key===' ') stop(); });
        okBtn.addEventListener('click',function(e){ e.preventDefault(); });
        okBtn.addEventListener('contextmenu',function(e){ e.preventDefault(); });
      }else{
        okBtn.addEventListener('click',function(){ done(true); });
      }
      document.addEventListener('keydown',onKey,true);
      window.addEventListener('scroll',place,true); window.addEventListener('resize',place);
      place();
      cancelBtn.focus({preventScroll:true});
      return p;
    }

    async function reloadConfig(el){

         including previews another browser tab is still working on. */

    async function saveAuthEnabled(el){
      var cb=$('auth_enabled');
      var status=$('auth_enabled_status');
      if(!cb) return;
      if(status){ status.textContent=''; status.style.color=''; }
      var want = !!cb.checked;
      if(!want){
        if(!await askConfirm(el,{title:'Turn off web login?',
          body:'Anyone on your network can reboot, reconfigure and update this display. Saved passwords and API keys become readable.',
          ok:'Turn off login',tone:'danger'})){
          cb.checked = true;
          return;
        }
      }
      fetch('/api/config',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({auth_enabled:want})
      }).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        invalidateConfigCache();
        /* auth_enabled is in no collectTab_* (it saves through this partial POST),
           so getConfigData() passes it through from _cfgCache. Patch the cached
           value AND the loadedConfig dirty-compare snapshot in place, or the next
           liveApply/Save would re-post the stale value and silently revert this
           change (same stale-cache clobber class as the image flip toggles). */
        if(_cfgCache) _cfgCache.auth_enabled = want;
        if(loadedConfig){
          try{
            var lc=JSON.parse(loadedConfig);
            lc.auth_enabled=want;
            loadedConfig=JSON.stringify(lc);
          }catch(e){}
        }
        if(status){
          status.textContent = want ? 'Authentication enabled.' : 'Authentication disabled.';
          status.style.color = '#6c6';
        }
        if($('signOutBtn')) $('signOutBtn').style.display = want ? '' : 'none';
        showToast(want ? 'Authentication enabled' : 'Authentication disabled','success');
      }).catch(function(e){
        if(status){ status.textContent='Save failed: '+e.message; status.style.color='#f66'; }
        showToast('Save failed: '+e.message,'error');
      });
    }

    /* Build the manual-update (full-erase) caution copy as HTML.
       `data` is a /api/check-update-json response; `tag` is substituted live. */
    function fullEraseCautionHtml(data){
      var tag=escHtml((data&&data.tag)||'');
      var eraseTag=escHtml((data&&data.full_erase_tag)||'');
      var relUrl=(data&&(data.release_url||data.html_url))||'https://github.com/chvvkumar/ESP32-P4-NINA-Display/releases';
      relUrl=escHtml(relUrl);
      // Name the intermediate release that forces the manual update when it differs
      // from the target. Empty eraseTag (history-incomplete fail-safe) or eraseTag
      // equal to the target keeps the existing single-version wording.
      var lead;
      if(eraseTag && eraseTag!==tag){
        lead='Updating to <strong>'+tag+'</strong> requires a manual update, because release <strong>'+eraseTag+'</strong> on the way requires a full erase. It cannot be installed over the air. ';
      } else {
        lead='Firmware <strong>'+tag+'</strong> requires a manual update. It cannot be installed over the air. ';
      }
      return lead+
        'First back up your settings on the Backup tab (Download Backup). '+
        'Then flash nina-display-factory.bin at address 0x0000 using the '+
        '<a href="https://espressif.github.io/esptool-js/" target="_blank" rel="noopener">ESP Web Flasher</a>. '+
        '<a href="'+relUrl+'" target="_blank" rel="noopener">View release</a>.';
    }

    /* Reveal the dismissible global banner for a manual-update release. */
    function showFullEraseBanner(data){
      var banner=$('fullEraseBanner');
      if(!banner) return;
