# TEMPORARY verification workflow for the `multiboard` branch.
#
# Why it exists: the real pipelines never run on this branch. build.yml
# triggers on main and dev, build-snd.yml on snd, and host-tests.yml pushes
# only on snd, so all 71 commits of phase 2 have never been through CI. This
# file runs the same work on multiboard so the pipeline is proven BEFORE the
# merge to snd.
#
# What it mirrors, step for step:
#   host-tests  = host-tests.yml job `host-tests`
#   cppcheck    = host-tests.yml job `cppcheck` (same flags, same suppressions,
#                 deliberately NOT "improved", or it would prove nothing)
#   build       = build-snd.yml job `build`, up to and including
#                 "Generate firmware binaries" and the network_adapter check
#
# What it deliberately does NOT do: build-snd.yml's last step, "Publish rolling
# alpha pre-release". That step force-moves the `snd-alpha` tag onto the commit
# it is run against and re-creates the alpha release. Run from this branch it
# would move the alpha tag off snd and hand untested firmware to every device
# on the alpha channel. `permissions: contents: read` below makes tagging,
# pushing and releasing impossible here even if a step tried.
#
# In place of the publish, the build job asserts that the exact six files
# build-snd.yml attaches to the release all exist, and that each app image
# fits the 8 MiB OTA slot. The slot check is an ADDITION, not a mirror: the
# real workflows measure the sizes but never gate on them.
#
# DELETE THIS FILE before merging to snd (`git rm
# .github/workflows/verify-multiboard.yml`). Nothing else references it.

name: Verify multiboard (temporary)

on:
  push:
    branches: [multiboard]
  workflow_dispatch:

# Read-only on purpose: no tag, no push, no release from this branch.
permissions:
  contents: read

env:
  IDF_VERSION: v5.5.2
  IDF_TARGET: esp32p4
  CCACHE_DIR: /opt/actions-runner-esp32/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESSLEVEL: 6

jobs:
  # ── mirror of host-tests.yml : host-tests ──────────────────────────────
  host-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure host test project
        run: cmake -S test/host -B build_host

      - name: Build host tests
        run: cmake --build build_host

      - name: Run host tests
        run: ctest --test-dir build_host --output-on-failure

  # ── mirror of host-tests.yml : cppcheck ────────────────────────────────
  cppcheck:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cppcheck
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends cppcheck || (sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck)

      - name: Run cppcheck against firmware sources
        run: |
          cppcheck \
            -j "$(nproc)" \
            --enable=warning,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c11 \
            -I main \
            -I main/ui \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unknownMacro \
            --suppress=comparePointers \
            --suppress=internalError:main/stb_image.h \
            --suppress=zerodivcond:main/stb_image.h \
            -i main/ui/lv_font_material_safety.c \
            -i main/ui/lv_font_superscript_24.c \
            -i main/ui/lv_font_overpass_16.c \
            -i main/ui/lv_font_overpass_27.c \
            -i main/ui/lv_font_playfair_228.c \
            -i main/ui/lv_font_playfair_90.c \
            -i main/stb_image.c \
            -i main/stb_image.h \
            main main/ui

  # ── mirror of build-snd.yml : build, minus the publish step ────────────
  build:
    name: Build both families
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false

      # clean:false preserves untracked caches (managed_components), but git
      # checkout does not restore a tracked file that was deleted in the
      # persistent workspace when its index entry matches the target ref --
      # a missing dependencies.lock then triggers a lockless dependency solve
      # that can pull incompatible component versions. Restore all tracked
      # files explicitly; untracked caches are untouched.
      - name: Restore tracked files
        run: git checkout --force HEAD -- .

      - name: Check for skip CI
        id: check_skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi '\[skip ci\]'; then
            echo "Skipping CI due to [skip ci] in commit message"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Read version
        if: steps.check_skip.outputs.skip != 'true'
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Determine embedded version override
        if: steps.check_skip.outputs.skip != 'true'
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Same mechanism build-snd.yml uses (generate_version.cmake reads
          # BUILD_GIT_TAG_OVERRIDE), with a distinct prefix so an artifact
          # from this temporary workflow can never be mistaken for an alpha
          # build if someone flashes it by hand.
          echo "BUILD_GIT_TAG_OVERRIDE=mbverify-${SHORT_SHA}" >> $GITHUB_ENV

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set ESP-IDF paths
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          echo "IDF_PATH=$HOME/esp/esp-idf" >> $GITHUB_ENV
          echo "IDF_TOOLS_PATH=$HOME/esp/tools" >> $GITHUB_ENV

      - name: Ensure ESP-IDF ${{ env.IDF_VERSION }} is installed
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          # Check if ESP-IDF is already installed and at the correct version
          if [ -f "$IDF_PATH/export.sh" ]; then
            INSTALLED_VERSION=$(git -C "$IDF_PATH" describe --tags --exact-match 2>/dev/null || echo "")
            if [ -z "$INSTALLED_VERSION" ] && [ -f "$IDF_PATH/version.txt" ]; then
              INSTALLED_VERSION="v$(cat "$IDF_PATH/version.txt" | tr -d '[:space:]')"
            fi
            echo "ESP-IDF found: ${INSTALLED_VERSION:-unknown}"
            if [ "$INSTALLED_VERSION" = "$IDF_VERSION" ]; then
              echo "Correct version already installed. Skipping."
              exit 0
            else
              echo "Version mismatch ($INSTALLED_VERSION != $IDF_VERSION). Reinstalling..."
              rm -rf "$IDF_PATH"
              rm -rf "$IDF_TOOLS_PATH"
            fi
          fi

          echo "Installing ESP-IDF $IDF_VERSION..."

          echo "::group::Clone ESP-IDF $IDF_VERSION"
          mkdir -p "$(dirname "$IDF_PATH")" "$(dirname "$IDF_TOOLS_PATH")"
          git clone --branch "$IDF_VERSION" --depth 1 --recursive \
            https://github.com/espressif/esp-idf.git "$IDF_PATH"
          echo "::endgroup::"

          echo "::group::Install ESP-IDF tools for $IDF_TARGET"
          "$IDF_PATH/install.sh" "$IDF_TARGET"
          echo "::endgroup::"

          echo "ESP-IDF $IDF_VERSION installation complete."

      - name: Setup ESP-IDF environment
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          . $IDF_PATH/export.sh
          echo "IDF version: $(idf.py --version)"

      - name: Setup ccache
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          # Install ccache if not present
          if ! command -v ccache &>/dev/null; then
            echo "Installing ccache..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          echo "ccache version: $(ccache --version | head -1)"
          ccache --zero-stats
          ccache --show-config | grep -E "max_size|cache_dir|compression"

      - name: Clean build state (always rebuild config)
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          # Decide whether managed_components also needs purging BEFORE removing
          # build_square/, since the comparison hash lives in
          # build_square/.build_config_hash.
          NEEDS_DEPS_CLEAN=false
          if [ -f build_square/.build_config_hash ]; then
            OLD_HASH=$(cat build_square/.build_config_hash)
            NEW_HASH=$(cat sdkconfig.defaults sdkconfig.defaults.square sdkconfig.defaults.round main/idf_component.yml main/CMakeLists.txt CMakeLists.txt dependencies.lock 2>/dev/null | sha256sum | cut -d' ' -f1)
            if [ "$OLD_HASH" != "$NEW_HASH" ]; then
              echo "Build config changed, will also purge managed_components"
              NEEDS_DEPS_CLEAN=true
            fi
          else
            echo "No previous successful build hash found, will also purge managed_components"
            NEEDS_DEPS_CLEAN=true
          fi

          # Always purge the family build directories and any legacy root
          # sdkconfig: a stale sdkconfig selects the wrong display pipeline and a
          # stale build_square/ or build_round/ keeps a stale build_version.h and
          # object files. ccache (separate CCACHE_DIR) is untouched, so recompiles
          # stay fast.
          rm -rf build build_square build_round sdkconfig
          echo "Removed build_square, build_round and any legacy build/sdkconfig"

          # Only re-download managed_components when the dependency/config hash
          # changed: it is pinned by dependencies.lock, and re-fetching from the
          # component registry every run adds a network failure point.
          if [ "$NEEDS_DEPS_CLEAN" = "true" ]; then
            rm -rf managed_components
            echo "Removed managed_components"
          else
            echo "Config unchanged, reusing managed_components"
          fi

      - name: Build project
        if: steps.check_skip.outputs.skip != 'true'
        env:
          IDF_CCACHE_ENABLE: 1
        run: |
          . $IDF_PATH/export.sh
          # Both families are built in ONE job on purpose, exactly as
          # build-snd.yml does it: a strategy.matrix would fork every later
          # step in the job.
          for FAMILY in square round; do
            echo "=== building family: $FAMILY ==="
            idf.py -B "build_${FAMILY}" \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${FAMILY}" \
              -DSDKCONFIG="build_${FAMILY}/sdkconfig" \
              build
          done

      - name: Save build config hash
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          cat sdkconfig.defaults sdkconfig.defaults.square sdkconfig.defaults.round main/idf_component.yml main/CMakeLists.txt CMakeLists.txt dependencies.lock 2>/dev/null | sha256sum | cut -d' ' -f1 > build_square/.build_config_hash

      - name: Show ccache stats
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          ccache --show-stats

      - name: Generate firmware binaries
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          . $IDF_PATH/export.sh
          mkdir -p firmware

          for FAMILY in square round; do
            BDIR="build_${FAMILY}"
            if [ "$FAMILY" = "round" ]; then PREFIX="nina-display-round"; else PREFIX="nina-display"; fi

            APP_BIN=$(python3 -c "
          import json
          with open('${BDIR}/project_description.json') as f:
              d = json.load(f)
          print('${BDIR}/' + d['app_bin'])
          ")
            APP_ELF=$(python3 -c "
          import json
          with open('${BDIR}/project_description.json') as f:
              d = json.load(f)
          print('${BDIR}/' + d['app_elf'])
          ")

            python3 -m esptool --chip esp32p4 merge_bin \
              --flash_mode dio \
              --flash_size 32MB \
              --flash_freq 80m \
              -o "firmware/${PREFIX}-factory.bin" \
              0x2000  "${BDIR}/bootloader/bootloader.bin" \
              0x8000  "${BDIR}/partition_table/partition-table.bin" \
              0x20000 "$APP_BIN"

            cp "$APP_BIN" "firmware/${PREFIX}-ota.bin"
            cp "$APP_ELF" "firmware/${PREFIX}.elf"

            echo "${FAMILY} factory: $(du -h firmware/${PREFIX}-factory.bin | cut -f1)"
            echo "${FAMILY} OTA:     $(du -h firmware/${PREFIX}-ota.bin | cut -f1)"
          done

          # Bootloader + partition table of the SQUARE build only, kept on disk
          # for local inspection. They are not uploaded as release assets.
          cp build_square/bootloader/bootloader.bin firmware/bootloader.bin
          cp build_square/partition_table/partition-table.bin firmware/partition-table.bin

      - name: Check for network_adapter.bin
        if: steps.check_skip.outputs.skip != 'true'
        id: network_adapter
        run: |
          if [ -f "network_adapter.bin" ]; then
            cp network_adapter.bin firmware/
            echo "included=true" >> $GITHUB_OUTPUT
          else
            echo "included=false" >> $GITHUB_OUTPUT
          fi

      # ── in place of build-snd.yml's "Publish rolling alpha pre-release" ──
      - name: Verify the release assets and project names
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          set -e

          # The exact six files build-snd.yml passes to `gh release create`.
          # If one is missing here, that publish step fails on snd.
          ASSETS="
          firmware/nina-display-factory.bin
          firmware/nina-display-ota.bin
          firmware/nina-display.elf
          firmware/nina-display-round-factory.bin
          firmware/nina-display-round-ota.bin
          firmware/nina-display-round.elf
          "
          MISSING=0
          for f in $ASSETS; do
            if [ -f "$f" ]; then
              printf 'ok      %-45s %s bytes\n' "$f" "$(stat -c%s "$f")"
            else
              printf 'MISSING %s\n' "$f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "::error::a release asset build-snd.yml attaches is missing"; exit 1; }

          # The per-family CMake project name is what the device's OTA header
          # check reads to refuse the other family's image, so a swap here
          # would ship cross-flashable binaries.
          SQ_NAME=$(python3 -c "import json;print(json.load(open('build_square/project_description.json'))['project_name'])")
          RD_NAME=$(python3 -c "import json;print(json.load(open('build_round/project_description.json'))['project_name'])")
          echo "square project name: $SQ_NAME"
          echo "round  project name: $RD_NAME"
          [ "$SQ_NAME" = "nina-display" ]       || { echo "::error::square project name is $SQ_NAME, expected nina-display"; exit 1; }
          [ "$RD_NAME" = "nina-display-round" ] || { echo "::error::round project name is $RD_NAME, expected nina-display-round"; exit 1; }

          # Each family must have compiled its own shape family in.
          grep -q '^CONFIG_NINA_FAMILY_SQUARE=y' build_square/sdkconfig || { echo "::error::build_square did not select the square family"; exit 1; }
          grep -q '^CONFIG_NINA_FAMILY_ROUND=y'  build_round/sdkconfig  || { echo "::error::build_round did not select the round family"; exit 1; }
          echo "shape families: square=CONFIG_NINA_FAMILY_SQUARE, round=CONFIG_NINA_FAMILY_ROUND"

      - name: Report OTA slot headroom
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          set -e
          # ota_0 / ota_1 are 0x800000 in partitions.csv. This gate does NOT
          # exist in build.yml or build-snd.yml: they measure the sizes and
          # never fail on them, so an over-size app would ship as a broken
          # release. Kept here because it costs nothing.
          SLOT=$((0x800000))
          FAIL=0
          for f in firmware/nina-display-ota.bin firmware/nina-display-round-ota.bin; do
            SZ=$(stat -c%s "$f")
            PCT=$(python3 -c "print(f'{$SZ * 100 / $SLOT:.1f}')")
            echo "$f: $SZ bytes, ${PCT}% of the 8 MiB OTA slot, $((SLOT - SZ)) bytes free"
            if [ "$SZ" -ge "$SLOT" ]; then
              echo "::error::$f does not fit the OTA slot"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Upload firmware artifacts
        if: steps.check_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: multiboard-verify-${{ steps.tag.outputs.short_sha }}
          path: firmware/
          retention-days: 7
