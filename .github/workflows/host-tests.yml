name: Host Tests

on:
  push:
    branches: [snd]
    paths:
      - 'main/**'
      - 'test/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'main/**'
      - 'test/**'
      - '.github/workflows/host-tests.yml'

jobs:
  host-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure host test project
        run: cmake -S test/host -B build_host

      - name: Build host tests
        run: cmake --build build_host

      - name: Run host tests
        run: ctest --test-dir build_host --output-on-failure

  cppcheck:
    name: Static Analysis (cppcheck)
    # Pinned: ubuntu-latest moved to 26.04, whose cppcheck 2.19 reports 30
    # errors (28 syntaxError on lv_font LV_VERSION_CHECK and asm("...") asset
    # labels, plus two false positives) on sources the 24.04 cppcheck accepts.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cppcheck
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends cppcheck || (sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck)

      # cppcheck's build dir caches per-file analysis keyed by the hash of
      # the preprocessed source, so unchanged files are skipped on the next
      # run (full tree about 110 s at 4 threads, warm run about 3 s). The
      # key never matches exactly, so every run restores the newest prior
      # entry through restore-keys and saves a fresh one.
      - name: Restore cppcheck analysis cache
        uses: actions/cache@v4
        with:
          path: cppcheck-build
          key: cppcheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cppcheck-${{ runner.os }}-

      - name: Run cppcheck against firmware sources
        run: |
          mkdir -p cppcheck-build
          cppcheck \
            -j "$(nproc)" \
            --cppcheck-build-dir=cppcheck-build \
            -USTB_IMAGE_IMPLEMENTATION \
            --enable=warning,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c11 \
            -I main \
            -I main/ui \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unknownMacro \
            --suppress=comparePointers \
            --suppress=internalError:main/stb_image.h \
            --suppress=zerodivcond:main/stb_image.h \
            -i main/ui/lv_font_material_safety.c \
            -i main/ui/lv_font_superscript_24.c \
            -i main/ui/lv_font_overpass_16.c \
            -i main/ui/lv_font_overpass_27.c \
            -i main/ui/lv_font_playfair_228.c \
            -i main/ui/lv_font_playfair_90.c \
            -i main/stb_image.c \
            main main/ui
        # Suppression rationale (kept explicit and narrow; any new finding
        # outside these exact classes/files still fails the job):
        #   missingIncludeSystem / missingInclude - firmware headers pull in
        #     ESP-IDF/FreeRTOS/LVGL headers that don't exist on this runner
        #     (no IDF toolchain here); these are not real findings.
        #   unknownMacro - ESP-IDF macros (ESP_LOGx, IRAM_ATTR, etc.) are
        #     unresolvable without the IDF headers; not a real finding.
        #   comparePointers - fires on the `xxx_end - xxx_start` idiom used
        #     by every EMBED_FILES/EMBED_TXTFILES asset (config_ui.html,
        #     login.html, setup_ui.html, favicon.png, logo.jpg,
        #     moon_equirect.jpg, audio_clips/*.pcm; verified across main.c,
        #     moon_sphere.cpp, audio_alert.c, web_handlers_auth.c,
        #     web_handlers_config.c) because cppcheck
        #     treats the two extern linker-symbol arrays as unrelated
        #     objects. Confirmed false positive for this pattern, not a
        #     first-party logic bug; suppressed by rule id only after
        #     manual verification of every occurrence.
        #   internalError / zerodivcond on main/stb_image.h - -i cannot
        #     exclude a header (cppcheck says so and ignores it), so the
        #     header body is still analyzed wherever it is #included and
        #     these need an explicit per-file suppression. stb_image.h is
        #     vendored third-party code we do not maintain.
        #   -USTB_IMAGE_IMPLEMENTATION - stb_image.h's #ifdef forest made
        #     cppcheck enumerate 12 preprocessor configurations for every
        #     includer (jpeg_utils.c, rainviewer.c, moon_sphere.cpp), each
        #     re-expanding the 277 KB implementation body: 178 CPU seconds
        #     for three files. Undefining the implementation macro keeps
        #     the declarations and drops the body, which is suppressed
        #     anyway; 44 CPU seconds, same findings.
        #   -i (excluded files) - generated LVGL bitmap font sources
        #     (main/ui/lv_font_*.c) are machine-generated glyph tables, and
        #     main/stb_image.* is a vendored third-party single-header
        #     library; neither is firmware logic we maintain.
